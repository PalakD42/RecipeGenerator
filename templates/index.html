<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 AI Recipe Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .container{
            max-width:800px;
            margin-top:50px;
        }

        pre{
            white-space:pre-wrap;
            word-wrap:break-word;
            font-size:16px;
        }

        #loading{
            display:none;
            color:#0d6efd;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="text-center mb-4">
        🍳 AI Recipe Generator
    </h1>

    <form id="tutorial-form">

        <div class="mb-3">
            <label class="form-label">
                Ingredients
            </label>

            <input
                class="form-control"
                id="components"
                name="components"
                placeholder="Example: Bread, Cheese, Tomato"
                required>
        </div>

        <button class="btn btn-success w-100">
            Generate Recipe
        </button>

    </form>

    <p id="loading" class="mt-3">
        👨‍🍳 Preparing your recipe...
    </p>

    <div class="card mt-4">

        <div class="card-header d-flex justify-content-between">

            <strong>Recipe</strong>

            <button
                class="btn btn-outline-primary btn-sm"
                onclick="copyToClipboard()">
                Copy
            </button>

        </div>

        <div class="card-body">

            <pre id="output"></pre>

        </div>

    </div>

</div>

<script>

document
.getElementById("tutorial-form")
.addEventListener("submit", generateTutorial);

async function generateTutorial(e){

    e.preventDefault();

    document.getElementById("loading").style.display="block";

    document.getElementById("output").textContent="";

    const formData=new FormData(document.getElementById("tutorial-form"));

    try{

        const response=await fetch("/generate",{
            method:"POST",
            body:formData
        });

        const result=await response.text();

        document.getElementById("output").textContent=result;

    }

    catch(error){

        document.getElementById("output").textContent=
        "Something went wrong.";

    }

    document.getElementById("loading").style.display="none";

}

function copyToClipboard(){

    const text=document.getElementById("output").textContent;

    navigator.clipboard.writeText(text);

    alert("Recipe copied!");
}

</script>

</body>
</html>
